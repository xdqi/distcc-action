name: 'distcc Tailnet Farm'
description: 'Turn GitHub runners into an ephemeral distcc farm over a Tailscale mesh'
branding:
  icon: 'cpu'
  color: 'green'
inputs:
  mode:
    description: 'coordinator|worker'
    required: true
  oauth-client-id:
    description: 'Tailscale OAuth client id (reserved; only the secret is used today)'
    required: false
  oauth-secret:
    description: 'Tailscale OAuth client secret'
    required: true
  expected-workers:
    description: 'workers expected (coordinator)'
    required: false
  min-workers:
    description: 'min online workers to proceed'
    required: false
  wait-timeout:
    description: 'max wait for workers'
    required: false
    default: '300s'
  worker-index:
    description: 'matrix index (worker)'
    required: false
  tags:
    description: 'tailnet tags'
    required: false
    default: 'tag:ci-distcc'
  run-prefix:
    description: 'naming prefix'
    required: false
  distcc-slots:
    description: 'per-worker slots (0=nproc)'
    required: false
    default: '0'
  lzo:
    description: 'enable LZO'
    required: false
    default: 'true'
  pump:
    description: 'enable pump (experimental)'
    required: false
    default: 'false'
  poll-interval:
    description: 'teardown poll'
    required: false
    default: '1s'
  teardown-threshold:
    description: 'consecutive offline reads'
    required: false
    default: '5'
  sccache:
    description: 'enable sccache'
    required: false
    default: 'false'
  distcc-log-level:
    description: 'distccd log level (worker): critical|error|warning|notice|info|debug'
    required: false
    default: 'info'
  install-distcc:
    description: 'Install the stock distcc package automatically (apt, Linux only). Default false: install it yourself.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to query this repo''s Releases API and download the prebuilt binary'
    required: false
    default: '${{ github.token }}'
outputs:
  # Node JS actions expose outputs by having the action's process write them to
  # $GITHUB_OUTPUT — which the Go binary already does (distcc-hosts/distcc-j/
  # workers-online). So these are declared WITHOUT a `value:` mapping; the
  # runner collects them from $GITHUB_OUTPUT after the action's main exits.
  distcc-hosts:
    description: 'assembled DISTCC_HOSTS'
  distcc-j:
    description: 'suggested -j'
  workers-online:
    description: 'participating workers'
runs:
  using: 'node24'
  main: 'dist/index.js'
