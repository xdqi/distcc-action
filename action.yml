name: 'distcc Tailnet Farm'
description: 'Turn GitHub runners into an ephemeral distcc farm over a Tailscale mesh'
inputs:
  mode:
    description: 'coordinator|worker'
    required: true
  oauth-client-id:
    description: 'Tailscale OAuth client id'
    required: true
  oauth-secret:
    description: 'Tailscale OAuth client secret'
    required: true
  expected-workers:
    description: 'workers expected (coordinator)'
    required: false
  min-workers:
    description: 'min online workers to proceed'
    required: false
  wait-timeout:
    description: 'max wait for workers'
    required: false
    default: '300s'
  worker-index:
    description: 'matrix index (worker)'
    required: false
  tags:
    description: 'tailnet tags'
    required: false
    default: 'tag:ci-distcc'
  run-prefix:
    description: 'naming prefix'
    required: false
  distcc-slots:
    description: 'per-worker slots (0=nproc)'
    required: false
    default: '0'
  lzo:
    description: 'enable LZO'
    required: false
    default: 'true'
  pump:
    description: 'enable pump (experimental)'
    required: false
    default: 'false'
  poll-interval:
    description: 'teardown poll'
    required: false
    default: '1s'
  teardown-threshold:
    description: 'consecutive offline reads'
    required: false
    default: '5'
  sccache:
    description: 'enable sccache'
    required: false
    default: 'false'
outputs:
  distcc-hosts:
    description: 'assembled DISTCC_HOSTS'
    value: '${{ steps.run.outputs.distcc-hosts }}'
  distcc-j:
    description: 'suggested -j'
    value: '${{ steps.run.outputs.distcc-j }}'
  workers-online:
    description: 'participating workers'
    value: '${{ steps.run.outputs.workers-online }}'
runs:
  using: 'composite'
  steps:
    - id: build-bin
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        if [ ! -x ./distcc-action ]; then
          CGO_ENABLED=0 go build -o distcc-action ./cmd/distcc-action
        fi
    - id: run
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OAUTH_CLIENT_ID: ${{ inputs.oauth-client-id }}
        INPUT_OAUTH_SECRET: ${{ inputs.oauth-secret }}
        INPUT_EXPECTED_WORKERS: ${{ inputs.expected-workers }}
        INPUT_MIN_WORKERS: ${{ inputs.min-workers }}
        INPUT_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        INPUT_WORKER_INDEX: ${{ inputs.worker-index }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_RUN_PREFIX: ${{ inputs.run-prefix }}
        INPUT_DISTCC_SLOTS: ${{ inputs.distcc-slots }}
        INPUT_LZO: ${{ inputs.lzo }}
        INPUT_PUMP: ${{ inputs.pump }}
        INPUT_POLL_INTERVAL: ${{ inputs.poll-interval }}
        INPUT_TEARDOWN_THRESHOLD: ${{ inputs.teardown-threshold }}
        INPUT_SCCACHE: ${{ inputs.sccache }}
      run: "${{ github.action_path }}/distcc-action"
