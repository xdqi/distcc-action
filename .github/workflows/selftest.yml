name: selftest
on: [workflow_dispatch]
jobs:
  workers:
    strategy:
      matrix: { idx: [1, 2] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # KEEP setup-go: `uses: ./` runs the action against the CURRENT checkout, so
      # the wrapper (empty GITHUB_ACTION_REF) builds the binary FROM SOURCE rather
      # than downloading a release — the self-test must exercise the committed code.
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      # distcc is installed by the action itself (install-distcc), exercising
      # that path; no manual apt step needed.
      - uses: ./
        with:
          mode: worker
          worker-index: ${{ matrix.idx }}
          install-distcc: true
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # KEEP setup-go: `uses: ./` builds from the current source (see workers job).
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - id: farm
        uses: ./
        with:
          mode: coordinator
          expected-workers: 2
          install-distcc: true
          # no min-workers -> defaults to expected (2): wait for BOTH workers so
          # the self-test exercises real multi-worker distribution. Slow starters
          # now make the bus (we wait for `expected` until wait-timeout).
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Build redis via the farm
        run: |
          echo "DISTCC_HOSTS=$DISTCC_HOSTS"
          echo "DISTCC_J=$DISTCC_J  CC_PREFIX=$DISTCC_CC_PREFIX  workers=$DISTCC_WORKERS_ONLINE"
          git clone --depth 1 https://github.com/redis/redis
          cd redis
          # DISTCC_VERBOSE is prefixed on THIS make only (not exported, not the
          # form a user copies) so the self-test can assert real distribution
          # without polluting the build environment. Streamed live; tee'd for grep.
          DISTCC_VERBOSE=1 make -j${DISTCC_J} CC="${DISTCC_CC_PREFIX} gcc" 2>&1 | tee /tmp/build.log
          test -x src/redis-server || { echo "redis-server not built"; exit 1; }
          echo "SELFTEST build = PASS"
          # Workers are reached via local forward ports (127.0.0.1:37xx) over the
          # tailnet, so distcc reports the host as 127.0.0.1:37xx — that's the
          # proof a unit was dispatched to a worker rather than compiled locally.
          if grep -qE "compile .* on 127\.0\.0\.1:37[0-9][0-9]" /tmp/build.log; then
            n=$(grep -cE "compile .* on 127\.0\.0\.1:37[0-9][0-9].* completed ok" /tmp/build.log)
            echo "SELFTEST distribution = CONFIRMED (${n} compiles dispatched to farm workers)"
          else
            echo "SELFTEST distribution = WARN (no remote dispatch seen; may have compiled locally)"
          fi
