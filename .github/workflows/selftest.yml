name: selftest
on: [workflow_dispatch]
jobs:
  workers:
    strategy:
      matrix: { idx: [1, 2] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: sudo apt-get update && sudo apt-get install -y distcc
      - uses: ./
        with:
          mode: worker
          worker-index: ${{ matrix.idx }}
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: sudo apt-get update && sudo apt-get install -y distcc
      - id: farm
        uses: ./
        with:
          mode: coordinator
          expected-workers: 2
          min-workers: 1
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Build redis via the farm
        run: |
          echo "DISTCC_HOSTS=$DISTCC_HOSTS"
          echo "DISTCC_J=$DISTCC_J  CC_PREFIX=$DISTCC_CC_PREFIX"
          git clone --depth 1 https://github.com/redis/redis
          cd redis
          # tee streams live to the job log AND saves for the distribution grep
          # below; NO trailing `| tail` (that would re-buffer and kill the live view).
          DISTCC_VERBOSE=1 make -j${DISTCC_J} CC="${DISTCC_CC_PREFIX} gcc" 2>&1 | tee /tmp/build.log
          test -x src/redis-server || { echo "redis-server not built"; exit 1; }
          echo "SELFTEST build = PASS"
          if grep -qE "compile .* on 100\." /tmp/build.log; then
            echo "SELFTEST distribution = CONFIRMED (compiles dispatched to tailnet workers)"
          else
            echo "SELFTEST distribution = WARN (no remote dispatch seen in verbose log; may have compiled locally)"
          fi
