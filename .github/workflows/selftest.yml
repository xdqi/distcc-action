name: selftest
on: [workflow_dispatch]
jobs:
  workers:
    strategy:
      matrix: { idx: [1, 2] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: sudo apt-get update && sudo apt-get install -y distcc
      - uses: ./
        with:
          mode: worker
          worker-index: ${{ matrix.idx }}
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: sudo apt-get update && sudo apt-get install -y distcc
      - id: farm
        uses: ./
        with:
          mode: coordinator
          expected-workers: 2
          min-workers: 1
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Build redis via the farm
        run: |
          echo "DISTCC_HOSTS=$DISTCC_HOSTS"
          echo "DISTCC_J=$DISTCC_J  CC_PREFIX=$DISTCC_CC_PREFIX  workers=$DISTCC_WORKERS_ONLINE"
          git clone --depth 1 https://github.com/redis/redis
          cd redis
          # Stream live; no DISTCC_VERBOSE (it's a distcc env var — keep the build
          # env clean, exactly as a real user would run it).
          make -j${DISTCC_J} CC="${DISTCC_CC_PREFIX} gcc"
          test -x src/redis-server || { echo "redis-server not built"; exit 1; }
          echo "SELFTEST build = PASS"
          # Distribution evidence comes from the WORKER jobs' distccd logs
          # (dcc_job_summary COMPILE_OK lines), not from polluting this build.
          if [ "${DISTCC_WORKERS_ONLINE:-0}" -ge 1 ]; then
            echo "SELFTEST farm = ${DISTCC_WORKERS_ONLINE} worker(s) online (see each worker job's distccd log for per-file dispatch)"
          fi
